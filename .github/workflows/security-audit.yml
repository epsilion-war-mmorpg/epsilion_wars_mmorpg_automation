name: security-audit

on:
  push:
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

env:
  EPSA_DISABLE_DOTENV: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  POETRY_VIRTUALENVS_IN_PROJECT: "true"

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.0

    - name: Set up Python
      uses: actions/setup-python@v6.3.0
      with:
        python-version: "3.12"
        cache: poetry
        cache-dependency-path: poetry.lock

    - name: Install audit tooling
      run: |
        python -m pip install "poetry==1.8.5" "poetry-plugin-export>=1.8,<2.0" "pip-audit==2.10.1"
        poetry --version
        python -m pip_audit --version

    - name: Export pinned requirements
      run: |
        poetry export --with dev --without-hashes -f requirements.txt -o requirements-audit.txt

    - name: Run pip-audit
      run: |
        python -m pip_audit -r requirements-audit.txt --no-deps
