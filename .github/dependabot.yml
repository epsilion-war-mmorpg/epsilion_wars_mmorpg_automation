version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
    groups:
      python-security-and-runtime:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:45"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
